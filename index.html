<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simon Says Game</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <h1>Simon Says Game</h1>
  <h2>Touch anywhere to start the game...</h2>

  <div class="btn-container">
    <div class="btn red" id="red"></div>
    <div class="btn yellow" id="yellow"></div>
    <div class="btn green" id="green"></div>
    <div class="btn purple" id="purple"></div>
  </div>

  <div id="scoreBoard">
    <h3>High Score: <span id="highScore">0</span></h3>
  </div>

  <script src="app.js"></script>
</body>
</html>
